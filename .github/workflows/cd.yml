name: CD - Deploy to Raspberry Pi 5

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker Hub image tag ("latest" or a 7-character commit SHA)'
        required: true
        default: 'latest'
        type: string

jobs:
  deploy:
    name: Deploy Stack to Pi 5 via Tailnet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect to Tailscale Tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PI_SSH_KEY }}

      - name: Sync compose file and deploy services
        env:
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_USER: ${{ secrets.PI_USER }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -f docker-compose.yml ]; then
            scp -o StrictHostKeyChecking=no docker-compose.yml $PI_USER@$PI_HOST:/opt/myapp/docker-compose.yml
          fi

          ssh -o StrictHostKeyChecking=no $PI_USER@$PI_HOST << EOF
            set -e
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            cd /opt/myapp
            export DOCKERHUB_USERNAME="$DOCKERHUB_USERNAME"
            export IMAGE_TAG="$IMAGE_TAG"

            APP_SERVICES="auth_service user_service gateway notification_service frontend"
            docker compose pull \$APP_SERVICES
            docker compose up -d --no-deps \$APP_SERVICES
            docker image prune -f
          EOF