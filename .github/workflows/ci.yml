name: CI - Test & Push to Docker Hub

on:
  push:
    branches:
      - master

jobs:
  backend-ci:
    name: Backend CI (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth_service, user_service, gateway, notification_service, content_service]
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: testpassword
          MARIADB_DATABASE: testdb
          MARIADB_USER: testuser
          MARIADB_PASSWORD: testpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set short commit SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/**/pom.xml

      - name: Run Maven verify
        env:
          DB_URL: jdbc:mariadb://localhost:3306/testdb
          DB_USERNAME: testuser
          DB_PASSWORD: testpassword
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.mariadb.jdbc.Driver
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
        run: mvn clean verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }} AMD64 image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bitrhythm-${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bitrhythm-${{ matrix.service }}:${{ env.SHORT_SHA }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

