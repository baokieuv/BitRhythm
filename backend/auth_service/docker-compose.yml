services:
  api-gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    image: bitrhythm/api-gateway:latest
    container_name: bitrhythm_api_gateway
    restart: unless-stopped
    init: true
    environment:
      GATEWAY_PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:8082}
      CONTENT_SERVICE_URL: ${CONTENT_SERVICE_URL:-http://content-service:8083}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      auth-service:
        condition: service_healthy
    networks:
      - auth_network
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  auth-service:
    build:
      context: ..
      dockerfile: auth_service/Dockerfile
    image: bitrhythm/auth-service:latest
    container_name: bitrhythm_auth_service
    restart: unless-stopped
    init: true
    environment:
      DB_URL: jdbc:mariadb://auth-database:3306/auth_service
      DB_USERNAME: ${AUTH_DB_USERNAME:-auth_service}
      DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD must be set}
      REDIS_HOST: auth-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${AUTH_REDIS_PASSWORD:?AUTH_REDIS_PASSWORD must be set}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?KAFKA_BOOTSTRAP_SERVERS must be set}
      NOTIFICATION_TOPIC: ${NOTIFICATION_TOPIC:-notification.events}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to a base64 secret of at least 32 bytes}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set}
      VERIFY_EMAIL_URL: ${VERIFY_EMAIL_URL:-http://localhost:3000/verify-email}
      RESET_PASSWORD_URL: ${RESET_PASSWORD_URL:-http://localhost:3000/reset-password}
    ports:
      - "${AUTH_SERVICE_PORT:-8081}:8081"
    depends_on:
      auth-database:
        condition: service_healthy
      auth-redis:
        condition: service_healthy
    networks:
      - auth_network
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8081/health/ready > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  auth-database:
    image: mariadb:11.4
    container_name: bitrhythm_auth_database
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: auth_service
      MARIADB_USER: ${AUTH_DB_USERNAME:-auth_service}
      MARIADB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD must be set}
      MARIADB_ROOT_PASSWORD: ${AUTH_DB_ROOT_PASSWORD:?AUTH_DB_ROOT_PASSWORD must be set}
    ports:
      - "${AUTH_DB_PORT:-3307}:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - auth_database_data:/var/lib/mysql
    networks:
      - auth_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  auth-redis:
    image: redis:7.4-alpine
    container_name: bitrhythm_auth_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${AUTH_REDIS_PASSWORD:?AUTH_REDIS_PASSWORD must be set}", "--appendonly", "yes"]
    ports:
      - "${AUTH_REDIS_PORT:-6380}:6379"
    volumes:
      - auth_redis_data:/data
    networks:
      - auth_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${AUTH_REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      AUTH_REDIS_PASSWORD: ${AUTH_REDIS_PASSWORD:?AUTH_REDIS_PASSWORD must be set}

networks:
  auth_network:
    driver: bridge

volumes:
  auth_database_data:
  auth_redis_data:
