spring:
  application:
    name: auth_service

  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/auth_service}
    username: ${DB_USERNAME:auth_service}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2
      connection-timeout: 5000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update          # simple start: tables are created from entities (switch to Flyway later)
      # also adds the new service_clients.allowed_audiences column automatically
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # Redis is used for caching
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cache:
    type: redis
    redis:
      time-to-live: 10m

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        "[acks]": all
        "[enable.idempotence]": true
        "[delivery.timeout.ms]": 120000

server:
  port: 8081
  # Needed for per-IP rate limiting behind a gateway/load balancer: use the real client IP from
  # X-Forwarded-For. Only safe if your gateway overwrites that header instead of passing it through.
  forward-headers-strategy: framework

jwt:
  access-token-ttl: 15m
  refresh-token-ttl: 14d

# Token signing (RS256) and service-to-service tokens
auth:
  token:
    # Must be identical to service-auth.resource.issuer in every service that validates our tokens.
    issuer: ${TOKEN_ISSUER:http://auth-service}
    user-audience: bit-rhythm-api   # "aud" of user access tokens
    self-audience: auth-service     # "aud" a service token must carry to call THIS service
    service-token-ttl: 5m
    clock-skew: 30s
    key-id: ${JWT_KEY_ID:auth-key-1}
    # PKCS#8 / X.509 PEM. Leave empty ONLY for local dev: an ephemeral key pair is generated at startup
    # (tokens stop working after a restart). Generate a real pair:
    #   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out private.pem
    #   openssl rsa -pubout -in private.pem -out public.pem
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
    # While rotating keys, keep the old public key here until every token signed with it has expired:
    # retired-keys:
    #   - key-id: auth-key-0
    #     public-key: ${JWT_PUBLIC_KEY_OLD}
    cleanup-cron: "0 0 3 * * *"     # purge expired refresh tokens (needs @EnableScheduling)

app:
  verification-token-ttl: 24h
  verify-email-url: ${VERIFY_EMAIL_URL:http://localhost:3000/verify-email}   # frontend page that POSTs the token to /auth/verify-email
  reset-password-url: ${RESET_PASSWORD_URL:http://localhost:3000/reset-password}
  notification-topic: ${NOTIFICATION_TOPIC:notification.events}
  admin:
    email: ${ADMIN_EMAIL:bitrhythm@gmail.com}
    username: ${ADMIN_USERNAME:bitrhythm admin}
    password: ${ADMIN_PASSWORD:123456}   # dev default only: set ADMIN_PASSWORD in every real environment

  # Rate limiting (Bucket4j, in memory, per client IP). "capacity" POST requests allowed per "period".
  rate-limit:
    enabled: true
    rules:
      - { path: /auth/login,               capacity: 10, period: 1m }
      - { path: /auth/register,            capacity: 5,  period: 1m }
      - { path: /auth/resend-verification, capacity: 5,  period: 15m }
      - { path: /auth/request-password-reset, capacity: 5, period: 15m }
      - { path: /auth/verify-email,        capacity: 10, period: 1m }
      - { path: /auth/refresh,             capacity: 30, period: 1m }
      # Service-to-service endpoints. Callers cache tokens (5m TTL), so legitimate traffic is low;
      # keep these generous enough for several services sharing one gateway/NAT IP.
      - { path: /token,                    capacity: 60, period: 1m }
      - { path: /token/introspect,         capacity: 120, period: 1m }

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        live:
          include: livenessState
        ready:
          include: readinessState,db