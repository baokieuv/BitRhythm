spring:
  application:
    name: auth_service

  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/auth_service}
    username: ${DB_USERNAME:auth_service}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2
      connection-timeout: 5000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none            # schema is owned by Flyway, Hibernate never touches it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:                      # rate limiting, access-token jti denylist
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s

  mail:                         # dev default: Mailpit / MailHog on localhost:1025
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  forward-headers-strategy: framework   # real client IP from your trusted gateway (used by audit log + rate limiting)

# ---------------------------------------------------------------------------
# Application settings (bind these to AppProperties / JwtProperties)
# ---------------------------------------------------------------------------
app:
  crypto:
    # Base64-encoded 32 bytes (AES-256-GCM). Encrypts TOTP secrets and private signing keys.
    # REQUIRED, no default on purpose: the app must fail fast if it is missing.
    # Generate one with: openssl rand -base64 32
    master-key: ${APP_MASTER_KEY}

  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8081}
    audience: ${JWT_AUDIENCE:bit-rhythm}
    access-token-ttl: 15m
    service-token-ttl: 10m

  tokens:
    refresh-token-ttl: 14d
    email-verification-ttl: 24h
    password-reset-ttl: 30m
    mfa-challenge-ttl: 5m

  security:
    password-min-length: 10
    max-failed-attempts: 5
    lock-duration: 15m
    mfa-max-attempts: 5

  mfa:
    issuer: ${MFA_ISSUER:BitRhythm}   # label shown in the authenticator app

  mail:
    from: ${MAIL_FROM:no-reply@localhost}
    verify-email-url: ${VERIFY_EMAIL_URL:http://localhost:3000/verify-email}
    reset-password-url: ${RESET_PASSWORD_URL:http://localhost:3000/reset-password}

  rate-limit:
    enabled: true
    login:           { max-requests: 10, window: 1m }
    register:        { max-requests: 5,  window: 1m }
    forgot-password: { max-requests: 5,  window: 15m }
    mfa:             { max-requests: 10, window: 1m }

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        live:
          include: livenessState
        ready:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    AUDIT: INFO                 # dedicated logger used by the audit module