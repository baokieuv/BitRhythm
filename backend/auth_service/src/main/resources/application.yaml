spring:
  application:
    name: auth_service

  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/auth_service}
    username: ${DB_USERNAME:auth_service}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2
      connection-timeout: 5000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update          # simple start: tables are created from entities (switch to Flyway later)
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # Redis is used for caching
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cache:
    type: redis
    redis:
      time-to-live: 10m

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        "[spring.json.add.type.headers]": false
        "[acks]": all
        "[enable.idempotence]": true
        "[delivery.timeout.ms]": 120000

server:
  port: 8081
  # Needed for per-IP rate limiting behind a gateway/load balancer: use the real client IP from
  # X-Forwarded-For. Only safe if your gateway overwrites that header instead of passing it through.
  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET}         # required, base64, >= 32 bytes. Generate: openssl rand -base64 48
  access-token-ttl: 15m
  refresh-token-ttl: 14d

app:
  verification-token-ttl: 24h
  verify-email-url: ${VERIFY_EMAIL_URL:http://localhost:3000/verify-email}   # frontend page that POSTs the token to /auth/verify-email
  reset-password-url: ${RESET_PASSWORD_URL:http://localhost:3000/reset-password}
  internal-api-key: ${INTERNAL_API_KEY}   # required. Other services send it in the X-Internal-Api-Key header
  notification-topic: ${NOTIFICATION_TOPIC:notification.events}

  # Rate limiting (Bucket4j, in memory, per client IP). "capacity" POST requests allowed per "period".
  rate-limit:
    enabled: true
    rules:
      - { path: /auth/login,               capacity: 10, period: 1m }
      - { path: /auth/register,            capacity: 5,  period: 1m }
      - { path: /auth/resend-verification, capacity: 5,  period: 15m }
      - { path: /auth/request-password-reset, capacity: 5, period: 15m }
      - { path: /auth/verify-email,        capacity: 10, period: 1m }
      - { path: /auth/refresh,             capacity: 30, period: 1m }

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        live:
          include: livenessState
        ready:
          include: readinessState,db