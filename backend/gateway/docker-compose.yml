services:
  api-gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    image: bitrhythm/api-gateway:latest
    container_name: bitrhythm_api_gateway
    restart: unless-stopped
    init: true
    environment:
      GATEWAY_PORT: 8080
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:?AUTH_SERVICE_URL must be set}
      USER_SERVICE_URL: ${USER_SERVICE_URL:?USER_SERVICE_URL must be set}
      CONTENT_SERVICE_URL: ${CONTENT_SERVICE_URL:?CONTENT_SERVICE_URL must be set}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set}
      JWT_ISSUER: ${JWT_ISSUER:?JWT_ISSUER must be set}
      JWT_JWK_SET_URI: ${JWT_JWK_SET_URI:?JWT_JWK_SET_URI must be set}
      JWT_AUDIENCES: ${JWT_AUDIENCES:-}
      GATEWAY_CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      GATEWAY_FORWARD_HEADERS: ${GATEWAY_FORWARD_HEADERS:-native}
      GATEWAY_RATE_LIMIT_ENABLED: ${GATEWAY_RATE_LIMIT_ENABLED:-true}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    networks:
      - gateway_network
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/health/liveness > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  gateway_network:
    driver: bridge
