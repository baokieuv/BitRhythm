spring:
  application:
    name: api-gateway
  main:
    web-application-type: servlet

server:
  port: ${GATEWAY_PORT:8080}
  forward-headers-strategy: framework
  max-http-request-header-size: 16KB
  tomcat:
    max-swallow-size: 10MB

gateway:
  internal-api-key: ${INTERNAL_API_KEY:}
  connect-timeout: ${GATEWAY_CONNECT_TIMEOUT:2s}
  read-timeout: ${GATEWAY_READ_TIMEOUT:15s}
  max-request-body-bytes: ${GATEWAY_MAX_REQUEST_BODY_BYTES:10485760}
  services:
    auth: ${AUTH_SERVICE_URL:http://localhost:8081}
    user: ${USER_SERVICE_URL:http://localhost:8082}
    content: ${CONTENT_SERVICE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
