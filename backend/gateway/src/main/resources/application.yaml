spring:
  application:
    name: api-gateway
  threads:
    virtual:
      enabled: true
  main:
    web-application-type: servlet
  lifecycle:
    timeout-per-shutdown-phase: 20s
  security:
    oauth2:
      resourceserver:
        jwt:
          # JWKS of auth-service, fetched lazily on the first token (the gateway starts even if auth is down).
          # ASSUMPTION: adjust the path to whatever auth-service really serves.
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
          # Required: tokens with a different `iss` are rejected. Set to the exact `iss` auth-service issues.
          issuer-uri: ${JWT_ISSUER}
          # Optional: set when auth-service puts an `aud` claim in tokens (comma separated).
          audiences: ${JWT_AUDIENCES:}
  cloud:
    gateway:
      server:
        webmvc:
          # Global upstream timeouts (Gateway MVC has no per-route timeout). Verify the property names
          # with the timeout test in the checklist: upstream sleeping 20s must give 504 after ~15s.
          http-client:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT:2s}
            read-timeout: ${GATEWAY_READ_TIMEOUT:15s}
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**
              filters:
                # auth-service maps its controllers under /auth: /api/auth/login -> /auth/login (strip only "api")
                - StripPrefix=1
                - RemoveRequestHeader=X-Internal-Api-Key
                - AddRequestHeader=X-Internal-Api-Key, ${INTERNAL_API_KEY}
                - name: Retry
                  args:
                    retries: 2
                    series: SERVER_ERROR
                    methods: GET,HEAD
                    backoff:
                      firstBackoff: 100ms
                      maxBackoff: 1s
                      factor: 2
                - name: CircuitBreaker
                  args:
                    name: auth-service
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/user/**
              filters:
                - StripPrefix=2
                - RemoveRequestHeader=X-Internal-Api-Key
                - AddRequestHeader=X-Internal-Api-Key, ${INTERNAL_API_KEY}
                - name: Retry
                  args:
                    retries: 2
                    series: SERVER_ERROR
                    methods: GET,HEAD
                    backoff:
                      firstBackoff: 100ms
                      maxBackoff: 1s
                      factor: 2
                - name: CircuitBreaker
                  args:
                    name: user-service
            - id: content-service
              uri: ${CONTENT_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/content/**
              filters:
                - StripPrefix=2
                - RemoveRequestHeader=X-Internal-Api-Key
                - AddRequestHeader=X-Internal-Api-Key, ${INTERNAL_API_KEY}
                - name: Retry
                  args:
                    retries: 2
                    series: SERVER_ERROR
                    methods: GET,HEAD
                    backoff:
                      firstBackoff: 100ms
                      maxBackoff: 1s
                      factor: 2
                - name: CircuitBreaker
                  args:
                    name: content-service

server:
  port: ${GATEWAY_PORT:8080}
  shutdown: graceful
  # native = only proxies matching server.tomcat.remoteip.internal-proxies (private ranges by default)
  # may set the client IP via X-Forwarded-For; anyone else cannot spoof it. Use `none` if exposed directly.
  forward-headers-strategy: ${GATEWAY_FORWARD_HEADERS:native}
  max-http-request-header-size: 16KB
  tomcat:
    max-swallow-size: 10MB

gateway:
  internal-api-key: ${INTERNAL_API_KEY}
  max-request-body-bytes: ${GATEWAY_MAX_REQUEST_BODY_BYTES:10485760}
  # First path segment after /api/. Only used to keep metric tags low-cardinality; keep in sync with routes.
  services: auth,user,content
  cors:
    allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:3000}
    allow-credentials: ${GATEWAY_CORS_ALLOW_CREDENTIALS:true}
    max-age: ${GATEWAY_CORS_MAX_AGE:1h}
  security:
    roles-claim: ${JWT_ROLES_CLAIM:roles}
    role-prefix: ${JWT_ROLE_PREFIX:ROLE_}
    admin-role: ${GATEWAY_ADMIN_ROLE:ADMIN}
    # Same list as auth-service's SecurityConfig permitAll. /token, /token/introspect and the JWKS are
    # service-to-service endpoints: there is no route for them, so they are not reachable from outside.
    public-endpoints:
      - POST /api/auth/register
      - POST /api/auth/login
      - POST /api/auth/refresh
      - POST /api/auth/logout
      - POST /api/auth/verify-email
      - POST /api/auth/resend-verification
      - POST /api/auth/request-password-reset
      - POST /api/auth/reset-password
  rate-limit:
    enabled: ${GATEWAY_RATE_LIMIT_ENABLED:true}
    # First matching rule wins. Buckets live in memory, per gateway instance.
    rules:
      - id: auth-login
        path: /api/auth/login
        methods: POST
        key: IP
        capacity: 10
        period: 1m
      - id: auth-register
        path: /api/auth/register
        methods: POST
        key: IP
        capacity: 5
        period: 1m
      - id: auth-recovery
        path: /api/auth/request-password-reset
        methods: POST
        key: IP
        capacity: 5
        period: 1m
      - id: auth-resend-verification
        path: /api/auth/resend-verification
        methods: POST
        key: IP
        capacity: 5
        period: 15m
      - id: auth-other
        path: /api/auth/**
        key: USER
        capacity: 120
        period: 1m
      - id: api-default
        path: /api/**
        key: USER
        capacity: 300
        period: 1m

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  # Tracing (optional): add spring-boot-starter-opentelemetry (see pom) and set the properties below
  # once an OTLP collector exists. Left off by default so the gateway does not spam export errors.
  # tracing:
  #   sampling:
  #     probability: 0.1

logging:
  pattern:
    level: "%5p [corr=%X{correlationId:-}]"