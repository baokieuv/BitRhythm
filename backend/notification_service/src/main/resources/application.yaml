spring:
  application:
    name: notification_service

  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/notification_service}
    username: ${DB_USERNAME:notification_service}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2
      connection-timeout: 5000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update          # simple start: tables are created from entities (switch to Flyway later)
      # also adds the new service_clients.allowed_audiences column automatically
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:kieubao2k4@gmail.com}
    password: ${MAIL_PASSWORD:zwac yohn qmho pdyr}
    protocol: smtps
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          trust: ${MAIL_HOST:smtp.gmail.com}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        "[spring.json.add.type.headers]": false
        "[acks]": all
        "[enable.idempotence]": true
        "[delivery.timeout.ms]": 120000
    consumer:
      group-id: ${NOTI_KAFKA_GROUP_ID:notification-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/smart-bin-realm}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8180/realms/smart-bin-realm/protocol/openid-connect/certs}

  # Redis is used for caching
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cache:
    type: redis
    redis:
      time-to-live: 10m

server:
  port: 8081
  # Needed for per-IP rate limiting behind a gateway/load balancer: use the real client IP from
  # X-Forwarded-For. Only safe if your gateway overwrites that header instead of passing it through.
  forward-headers-strategy: framework

app:
  email:
    from: ${NOTI_EMAIL_FROM:kieubao2k4@gmail.com}
    verification:
      url: ${APP_EMAIL_VERIFICATION_URL:http://localhost:3000/verify-email}
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:3000}
  kafka:
    topics:
      send-email: ${TOPIC_SEND_EMAIL:send-email-topic}
      send-noti: ${TOPIC_DEVICE_NOTIFICATION:device-notification-topic}