spring:
  application:
    name: notification_service

  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/notification_service}
    username: ${DB_USERNAME:notification_service}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2
      connection-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update          # simple start: tables are created from entities (switch to Flyway later)
      # also adds the new service_clients.allowed_audiences column automatically
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer: a malformed message is logged and skipped instead of blocking the partition
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        "[spring.deserializer.value.delegate.class]": org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        "[spring.json.value.default.type]": com.bit_rhythm.notification_service.event.NotificationEvent
        "[spring.json.trusted.packages]": com.bit_rhythm.notification_service.event,com.bit_rhythm.notification_service.core
        # producers (auth-service) do not send type headers
        "[spring.json.use.type.headers]": false

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${MAIL_SMTP_AUTH:false}
      "[mail.smtp.starttls.enable]": ${MAIL_STARTTLS:false}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000

  messages:
    basename: i18n/messages
    fallback-to-system-locale: false

  # Tokens are issued by auth-service. Keys come from its JWKS; nothing secret is shared.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER}                                  # exactly auth-service's TOKEN_ISSUER
          # users (inbox API) + services (internal API, audience = this service's name)
          audiences: ${JWT_AUDIENCES:bit-rhythm-api,notification-service}

server:
  port: 8084
  forward-headers-strategy: framework

notification:
  kafka:
    topic: ${NOTIFICATION_TOPIC:notification.events}
    max-retries: 5
    initial-backoff: 1s
    max-backoff: 30s
  email:
    provider: ${EMAIL_PROVIDER:smtp}     # smtp (spring.mail.*, e.g. mailpit) | gmail | (ses, sendgrid ... later)
    from: ${MAIL_FROM:no-reply@bitrhythm.local}   # smtp provider only: Gmail always sends from its own account
    from-name: Bit Rhythm
    gmail:                               # used when provider = gmail
      username: ${GMAIL_USERNAME:}
      app-password: ${GMAIL_APP_PASSWORD:}
  inbox:
    heartbeat: 10s                       # SSE keep-alive, must be shorter than any proxy/gateway read timeout
    max-page-size: 50
  retention:
    log: 90d
    inbox: 180d

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        live:
          include: livenessState
        ready:
          include: readinessState,db,redis
