<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/></head>
<body style="font-family:Arial,Helvetica,sans-serif;max-width:560px;margin:0 auto;color:#222;">
  <h2>Verify your email</h2>
  <p>Thanks for signing up. Confirm your email address to activate your account.</p>
  <p><a th:href="${data['verifyUrl']}" style="background:#1db954;color:#fff;padding:10px 18px;border-radius:6px;text-decoration:none;">Verify email</a></p>
  <p style="font-size:12px;">If the button does not work, copy this link:<br/><span th:text="${data['verifyUrl']}"></span></p>
  <p style="color:#888;font-size:12px;">If you did not create an account you can ignore this email.</p>
</body>
</html>
