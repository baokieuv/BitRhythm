<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/></head>
<body style="font-family:Arial,Helvetica,sans-serif;max-width:560px;margin:0 auto;color:#222;">
  <h2>Xác thực email</h2>
  <p>Cảm ơn bạn đã đăng ký. Hãy xác nhận địa chỉ email để kích hoạt tài khoản.</p>
  <p><a th:href="${data['verifyUrl']}" style="background:#1db954;color:#fff;padding:10px 18px;border-radius:6px;text-decoration:none;">Xác thực email</a></p>
  <p style="font-size:12px;">Nếu nút không hoạt động, hãy sao chép liên kết này:<br/><span th:text="${data['verifyUrl']}"></span></p>
  <p style="color:#888;font-size:12px;">Nếu bạn không tạo tài khoản, hãy bỏ qua email này.</p>
</body>
</html>
