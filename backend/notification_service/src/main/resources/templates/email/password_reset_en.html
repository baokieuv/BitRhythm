<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/></head>
<body style="font-family:Arial,Helvetica,sans-serif;max-width:560px;margin:0 auto;color:#222;">
  <h2>Reset your password</h2>
  <p>We received a request to reset your password. The link expires soon.</p>
  <p><a th:href="${data['resetUrl']}" style="background:#1db954;color:#fff;padding:10px 18px;border-radius:6px;text-decoration:none;">Reset password</a></p>
  <p style="font-size:12px;">If the button does not work, copy this link:<br/><span th:text="${data['resetUrl']}"></span></p>
  <p style="color:#888;font-size:12px;">If you did not request this you can ignore this email.</p>
</body>
</html>
