spring:
  application:
    name: user_service

  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/user_service}
    username: ${DB_USERNAME:user_service}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2
      connection-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update          # simple start: tables are created from entities (switch to Flyway later)
      # also adds the new service_clients.allowed_audiences column automatically
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:        # outbox worker: sends the JSON stored in the outbox row as it is
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        "[acks]": all
    consumer:        # [S2] events of auth-service; the listener parses the JSON itself
      group-id: user-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  # Tokens are issued by auth-service. Keys come from its JWKS; nothing secret is shared.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER}                                  # exactly auth-service's TOKEN_ISSUER
          # users + services (internal API: the caller needs "user-service" in its allowed audiences)
          audiences: ${JWT_AUDIENCES:bit-rhythm-api,user-service}

server:
  port: 8082
  forward-headers-strategy: framework

user:
  avatar:
    bucket: ${AVATAR_BUCKET:user-assets}     # public-read on avatars/* (see docker-compose.common.yml)
    max-bytes: 2097152                        # 2 MB
    allowed-types: image/jpeg,image/png,image/webp,image/gif
    presign-ttl: 5m
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}               # server side: stat, delete (docker: http://minio:9000)
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000} # the host the BROWSER can reach: presigned URLs are signed with it
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
  topics:
    notification: ${NOTIFICATION_TOPIC:notification.events}   # NEW_FOLLOWER ... (contract of notification-service)
    auth-events: ${AUTH_EVENTS_TOPIC:auth.events}             # [S2] USER_DELETED / USER_DISABLED published by auth-service
  kafka:
    max-retries: 5
    initial-backoff: 1s
    max-backoff: 30s
  pagination:
    max-page-size: 50
  auth-service:
    base-url: ${AUTH_SERVICE_URL:http://localhost:8081}

service-auth:
  client:
    token-uri: ${AUTH_TOKEN_URI:http://localhost:8081/api/auth/token}
    client-id: ${SERVICE_CLIENT_ID:user-service}
    client-secret: ${SERVICE_CLIENT_SECRET:}
    scope: write:internal:role_assignments

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        live:
          include: livenessState
        ready:
          include: readinessState,db
