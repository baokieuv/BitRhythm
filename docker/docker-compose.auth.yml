# auth-service + its own database
services:
  auth-service:
    build:
      context: ..
      dockerfile: backend/auth_service/Dockerfile
    image: bitrhythm/auth-service:latest
    container_name: bitrhythm_auth_service
    restart: unless-stopped
    init: true
    env_file:
      - env/shared.env
      - env/redis.env
      - env/auth.env
    ports:
      - "${AUTH_SERVICE_HOST_PORT:-8081}:8081"
    depends_on:
      auth-database:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - auth_network      # private: auth-service <-> auth-database
      - service_network   # gateway / other services call auth over HTTP
      - common_network    # kafka, redis
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8081/health/ready > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  auth-database:
    image: mariadb:11.4
    container_name: bitrhythm_auth_database
    restart: unless-stopped
    env_file:
      - env/auth.env
    ports:
      - "${AUTH_DB_HOST_PORT:-3307}:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - auth_database_data:/var/lib/mysql
    networks:
      - auth_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  auth_network:
    driver: bridge

volumes:
  auth_database_data: