# content-service + its own database
services:
  content-service:
    build:
      context: ../backend
      dockerfile: content_service/Dockerfile
    image: bitrhythm/content-service:latest
    container_name: bitrhythm_content_service
    restart: unless-stopped
    init: true
    env_file:
      - env/shared.env
      - env/redis.env
      - env/content.env
    environment:
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "${CONTENT_SERVICE_HOST_PORT:-8083}:8083"
    depends_on:
      content-database:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - content_network   # private: content-service <-> content-database
      - service_network   # gateway / other services call it over HTTP (JWKS is fetched from auth-service here)
      - common_network    # kafka, redis, minio
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8083/health/ready > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  content-database:
    image: mariadb:11.4
    container_name: bitrhythm_content_database
    restart: unless-stopped
    env_file:
      - env/content.env
    ports:
      - "${CONTENT_DB_HOST_PORT:-3310}:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - content_database_data:/var/lib/mysql
    networks:
      - content_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  content_network:
    driver: bridge

volumes:
  content_database_data:
