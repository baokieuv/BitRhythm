# notification-service + its own database (+ mailpit: a fake SMTP server with a web UI, for local development)
services:
  notification-service:
    build:
      context: ../backend
      dockerfile: notification_service/Dockerfile
    image: bitrhythm/notification-service:latest
    container_name: bitrhythm_notification_service
    restart: unless-stopped
    init: true
    env_file:
      - env/shared.env
      - env/redis.env
      - env/notification.env
    environment:
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "${NOTIFICATION_SERVICE_HOST_PORT:-8084}:8084"
    depends_on:
      notification-database:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - notification_network   # private: notification-service <-> its database <-> mailpit
      - service_network        # gateway / other services call it over HTTP (JWKS is fetched from auth-service here)
      - common_network         # kafka, redis
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8084/health/ready > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  notification-database:
    image: mariadb:11.4
    container_name: bitrhythm_notification_database
    restart: unless-stopped
    env_file:
      - env/notification.env
    ports:
      - "${NOTIFICATION_DB_HOST_PORT:-3308}:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - notification_database_data:/var/lib/mysql
    networks:
      - notification_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Local development only: catches every email (web UI on http://localhost:8025). Remove it in production
  # and point MAIL_HOST / MAIL_PORT / MAIL_USERNAME / MAIL_PASSWORD at the real SMTP relay.
  mailpit:
    image: axllent/mailpit:latest
    container_name: bitrhythm_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_HOST_PORT:-8025}:8025"
    networks:
      - notification_network

networks:
  notification_network:
    driver: bridge

volumes:
  notification_database_data: