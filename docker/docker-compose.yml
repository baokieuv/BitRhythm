services:
  mariadb:
    image: mariadb:11
    container_name: music_mariadb
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: keycloak       
      MARIADB_USER: ${MARIADB_USER}   
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    ports:
      - "3306:3306"
    command: --lower-case-table-names=1
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./mariadb_init:/docker-entrypoint-initdb.d
    networks:
      - music_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: music_keycloak
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8180:8080"
    environment:
      KC_DB: mariadb
      KC_DB_URL: jdbc:mariadb://mariadb:3306/keycloak
      KC_DB_USERNAME: ${MARIADB_USER}
      KC_DB_PASSWORD: ${MARIADB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USERNAME}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_PROXY_HEADERS: xforwarded
    command: start-dev --features=token-exchange,admin-fine-grained-authz
    depends_on:
      mariadb:
        condition: service_healthy # ADDED: Wait for the healthcheck to pass
    networks:
      - music_network

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: music_minio
    restart: unless-stopped
    ports:
        - "9000:9000"
        - "9001:9001"
    environment:
        MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
        MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
        MINIO_SERVER_URL: ${MINIO_SERVER_URL}
        MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL}
    volumes:
        - ./minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - music_network

  minio-setup:
    image: alpine:latest
    container_name: music_minio_setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      echo 'Installing AWS CLI...';
      apk add --no-cache aws-cli;
      export AWS_ACCESS_KEY_ID=${MINIO_ACCESS_KEY};
      export AWS_SECRET_ACCESS_KEY=${MINIO_SECRET_KEY};
      export AWS_DEFAULT_REGION=us-east-1;
      
      echo 'Waiting for MinIO to start...';
      sleep 5;
      until aws --endpoint-url http://minio:9000 s3 ls; do
        echo 'Retrying...';
        sleep 2;
      done;
      
      echo 'Creating bucket...';
      aws --endpoint-url http://minio:9000 s3 mb s3://music-streaming || true;
      
      echo 'Setting anonymous download policy...';
      echo '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":\"*\",\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::music-streaming/*\"]}]}' > /tmp/policy.json;
      aws --endpoint-url http://minio:9000 s3api put-bucket-policy --bucket music-streaming --policy file:///tmp/policy.json;
      
      echo 'MinIO setup completed successfully.';
      exit 0;
      "
    networks:
      - music_network

  redis:
    image: redis:7.2-alpine
    container_name: music_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      --requirepass ${REDIS_PASSWORD}
      --notify-keyspace-events Ex
    volumes:
      - ./redis_data:/data
    networks:
      - music_network

networks:
  music_network:
    driver: bridge

volumes:
  mariadb_data: